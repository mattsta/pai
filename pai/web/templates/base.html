<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pai - Polyglot AI Interface</title>

    <!-- HTMX for dynamic interactions -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>

    <style>
        /* CSS Variables for theming */
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #eaeaea;
            --text-secondary: #a0a0a0;
            --accent-primary: #e94560;
            --accent-secondary: #533483;
            --success: #4ade80;
            --warning: #fbbf24;
            --error: #ef4444;
            --border-color: #2d3748;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            --radius: 8px;
            --radius-lg: 12px;
        }

        /* Reset and base */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Layout */
        .app-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
            gap: 0;
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent-primary);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* Main chat area */
        .main-content {
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-section {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-section h3 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        /* Chat messages */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: var(--accent-secondary);
            border-bottom-right-radius: 4px;
        }

        .assistant-message {
            align-self: flex-start;
            background: var(--bg-tertiary);
            border-bottom-left-radius: 4px;
        }

        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator::after {
            content: '';
            animation: ellipsis 1.5s infinite;
        }

        @keyframes ellipsis {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* Input area */
        .input-area {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .input-form {
            display: flex;
            gap: 12px;
        }

        .input-form textarea {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            min-height: 48px;
            max-height: 200px;
        }

        .input-form textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .input-form textarea::placeholder {
            color: var(--text-secondary);
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: #d63850;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: #1a4a7a;
        }

        .btn-icon {
            padding: 8px;
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-icon:hover {
            color: var(--text-primary);
        }

        /* Stats bar */
        .stats-compact {
            display: flex;
            gap: 16px;
            font-size: 0.875rem;
        }

        .stat-item {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .stat-icon {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .stat-value {
            font-weight: 500;
        }

        /* Model list */
        .model-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 300px;
            overflow-y: auto;
        }

        .model-item {
            padding: 8px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s ease;
            font-size: 0.875rem;
        }

        .model-item:hover {
            background: var(--bg-tertiary);
        }

        .model-item.current {
            background: var(--accent-secondary);
        }

        .model-name {
            font-family: 'Monaco', 'Menlo', monospace;
        }

        /* Search input */
        .search-input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 0.875rem;
            margin-bottom: 12px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        /* Badges */
        .badge {
            font-size: 0.625rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--accent-primary);
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-left: 8px;
        }

        /* Feedback messages */
        .success {
            color: var(--success);
            padding: 8px;
            font-size: 0.875rem;
        }

        .error {
            color: var(--error);
            padding: 8px;
            font-size: 0.875rem;
        }

        /* Forms in sidebar */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .form-group input[type="number"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
        }

        .form-group input[type="range"] {
            width: 100%;
        }

        .form-group output {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-left: 8px;
        }

        .form-group small {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Endpoints */
        .endpoint-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .endpoint-item {
            padding: 8px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .endpoint-item:hover {
            background: var(--bg-tertiary);
        }

        .endpoint-item.current {
            background: var(--accent-secondary);
        }

        .endpoint-name {
            font-weight: 500;
        }

        .endpoint-details {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Stats panel */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: var(--radius);
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-card .stat-value {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .stat-card .stat-secondary {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .stat-card.highlight {
            background: var(--accent-secondary);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }

        /* Model count header */
        .models-header {
            padding: 8px 0;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .model-count {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Load more button */
        .load-more {
            padding: 12px 0;
            text-align: center;
        }

        /* Current model display */
        .current-model-display {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-model-display .muted {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .success-indicator {
            color: var(--success);
            font-size: 0.75rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .message {
                max-width: 95%;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
