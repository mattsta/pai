[project]
name = "pai"
version = "0.3.0"
description = "Polyglot AI is an interactive, provider-agnostic CLI for interacting with any AI model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "prompt-toolkit>=3.0.51",
    "typer>=0.16.0",
    "rich>=14.0.0",
    "ulid-py>=1.1.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.1",
    "pydantic>=2.9.0",
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = [
  # convert legacy python syntax to modern syntax
  "UP",
  # isort imports
  "I",
]
ignore = ["E402"] # Ignore Module level import not at top of file

[project.scripts]
pai = "pai.pai:main"
pai-web = "pai.web:run_server_cli"

[project.entry-points."polyglot_ai.protocols"]
openai_chat = "pai.protocols.openai_chat_adapter:OpenAIChatAdapter"
legacy_completion = "pai.protocols.legacy_completion_adapter:LegacyCompletionAdapter"
anthropic = "pai.protocols.anthropic_adapter:AnthropicAdapter"
ollama = "pai.protocols.ollama_adapter:OllamaAdapter"

[tool.hatch.build.targets.wheel]
packages = ["pai/"]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

# Note: this [dependency-groups] block IS THE CORRECT BLOCK FOR DEV DEPENDENCIES.
#       DO NOT REMOVE OR RENAME THIS BLOCK.
[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.1",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = false  # Too noisy with dynamic JSON handling
warn_unused_configs = true
ignore_missing_imports = true
# Disable strict checks that conflict with existing patterns
disable_error_code = [
    "has-type",
    "no-redef",
    "override",      # LSP violations from adapter pattern
    "union-attr",    # Optional access patterns
    "arg-type",      # Common with dynamic configs
    "return-value",  # Complex return types
    "dict-item",     # Dynamic dict construction
    "import-untyped", # Third-party libs without stubs
    "attr-defined",  # Dynamic attribute patterns
    "assignment",    # Type narrowing patterns
    "abstract",      # Factory patterns
    "call-arg",      # Pydantic alias patterns
    "index",         # Dynamic dict access patterns
    "var-annotated", # Inferred type annotations
    "operator",      # Dynamic operator overloading
]
